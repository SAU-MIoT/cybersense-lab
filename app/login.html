<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Giriş | SARGEM CyberSense Laboratuvarı</title>
  <meta name="robots" content="noindex,nofollow">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <a class="login-brand" href="index.html" aria-label="Ana sayfa">
        <span>S</span>
        <strong>CyberSense Laboratuvarı</strong>
      </a>
      <div class="login-copy">
        <p>Yönetim Girişi</p>
        <h1 id="login-title">Guvenli admin oturumu</h1>
      </div>

      <form id="login-form" class="login-form" autocomplete="on">
        <label>
          <span>Kullanici adi</span>
          <input type="text" name="email" autocomplete="username" required>
        </label>
        <label>
          <span>Sifre</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button id="login-submit" type="submit" class="btn-cyber">
          <i class="fa fa-right-to-bracket"></i> Giriş
        </button>
        <div id="login-message" class="login-message" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
