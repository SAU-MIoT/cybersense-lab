<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yayınlar | SARGEM CyberSense Laboratuvarı</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<div class="page-header">
  <div class="container">
    <h1><i class="fa fa-book-open me-2" style="color:var(--cyan);"></i>Yayınlar</h1>
    <p>Dergi makaleleri, konferans bildirileri ve akademik çalışmalar</p>
  </div>
</div>

<section style="background:#fff; padding:48px 0;">
  <div class="container">
    <!-- Filter tabs -->
    <div class="d-flex gap-2 flex-wrap mb-4" id="filter-tabs">
      <button class="btn-filter active" data-filter="all">Tümü</button>
      <button class="btn-filter" data-filter="journal">Dergiler</button>
      <button class="btn-filter" data-filter="conference">Konferanslar</button>
    </div>
    <div id="publications-list"></div>
  </div>
</section>

<div id="footer"></div>
<button id="btt" aria-label="Yukarı çık"><i class="fa fa-chevron-up"></i></button>

<style>
.btn-filter {
  background: var(--gray-light); border: 1.5px solid #e6edf5; color: var(--navy-mid);
  padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.btn-filter.active, .btn-filter:hover {
  background: var(--navy-mid); color: var(--cyan); border-color: var(--navy-mid);
}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/yayinlar.js"></script>
</body>
</html>
