<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haberler | SARGEM CyberSense Laboratuvarı</title>
  <meta name="description" content="SARGEM CyberSense Laboratuvarı haberleri, duyuruları ve öne çıkan gelişmeleri">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css?v=20260518a" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<!-- Page Header -->
<div class="page-header">
  <div class="container">
    <h1><i class="fa fa-newspaper me-2" style="color:var(--cyan);"></i>Haberler</h1>
    <p>Laboratuvardan son gelişmeler, başarılar ve önemli duyurular</p>
  </div>
</div>

<!-- Content -->
<section class="news-bg" style="padding:48px 0 64px;">
  <div class="container">
    <div id="announcements-list" class="row g-4"></div>
  </div>
</section>

<div id="footer"></div>
<button id="btt" aria-label="Yukarı çık"><i class="fa fa-chevron-up"></i></button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/announcements.js?v=20260517k"></script>

<!-- Haber Detay Modali -->
<div class="modal fade" id="annModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content" style="border-radius:16px;border:none;overflow:hidden;">
      <div class="modal-header" style="background:var(--navy);color:#fff;border-bottom:2px solid var(--cyan);padding:18px 24px;">
        <h5 class="modal-title" id="annModalTitle" style="font-size:16px;font-weight:700;"></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body" id="annModalBody" style="padding:24px;font-size:14px;color:var(--navy);line-height:1.8;white-space:pre-wrap;"></div>
      <div class="modal-footer" style="border-top:1px solid #edf2f7;padding:12px 24px;">
        <small id="annModalDate" style="color:var(--gray-mid);margin-right:auto;"></small>
        <button type="button" class="btn btn-sm" data-bs-dismiss="modal" style="background:var(--cyan);color:var(--navy);font-weight:600;border-radius:8px;padding:6px 18px;">Kapat</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
